<!DOCTYPE html>
<html data-theme="dark" lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Store | Arinola Theatre
  </title>
  <link href="css/tokens.css" rel="stylesheet"/>
  <link href="css/components.css" rel="stylesheet"/>
  <link href="css/responsive.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="site-header">
  </div>
  <main>
   <section class="page-hero">
    <div class="page-hero__inner container">
     <p class="page-hero__eyebrow sticker sticker--pink">
      Store
     </p>
     <h1 class="page-hero__title">
      Print, merch, tickets, and theatre objects.
     </h1>
     <p class="page-hero__text">
      A future home for Arinola Theatre merchandise, magazines, tickets, posters, and limited-run creative work.
     </p>
    </div>
   </section>
   <section class="section">
    <div class="section__inner container">
     <div class="section-heading">
      <p class="eyebrow">
       Shop
      </p>
      <h2 class="section-heading__title">
       Store coming soon
      </h2>
     </div>
     <div class="card-grid">
      <article class="person-card">
       <div class="person-card__image image-placeholder">
        <span>
         Product
        </span>
       </div>
       <h2 class="person-card__name">
        Magazine / Poster
       </h2>
       <p class="person-card__role">
        Product details coming soon.
       </p>
      </article>
      <article class="person-card">
       <div class="person-card__image image-placeholder">
        <span>
         Product
        </span>
       </div>
       <h2 class="person-card__name">
        Merch Item
       </h2>
       <p class="person-card__role">
        Product details coming soon.
       </p>
      </article>
     </div>
    </div>
   </section>
  </main>
  <div id="site-cta">
  </div>
  <div id="site-footer">
  </div>
  <!-- JS -->
  <script src="js/header.js">
  </script>
  <script src="js/theme-toggle.js">
  </script>
  <script src="js/footer.js">
  </script>
  <script src="js/contact.js">
  </script>
  <script src="js/fullscreen-viewer.js">
  </script>
 </body>
</html>
