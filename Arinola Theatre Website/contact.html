<!DOCTYPE html>
<html data-theme="dark" lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Contact | Arinola Theatre
  </title>
  <link href="css/tokens.css" rel="stylesheet"/>
  <link href="css/components.css" rel="stylesheet"/>
  <link href="css/responsive.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="site-header">
  </div>
  <main>
   <section class="page-hero">
    <div class="page-hero__inner container">
     <p class="page-hero__eyebrow sticker sticker--pink">
      Contact
     </p>
     <h1 class="page-hero__title">
      Start a conversation.
     </h1>
     <p class="page-hero__text">
      For bookings, collaborations, projects, workshops, or general enquiries.
     </p>
    </div>
   </section>
   <section class="section section--contact">
    <div class="section__inner container contact-layout">
     <div class="contact-layout__intro">
      <p class="eyebrow">
       Enquiries
      </p>
      <h2 class="section-heading__title">
       Tell us what you&rsquo;re working on.
      </h2>
      <p>
       This form can later be wired up through Formspree, Netlify Forms, EmailJS, or a backend.
      </p>
     </div>
     <form action="#" class="contact-form" method="post">
      <div class="form-field">
       <label class="form-field__label" for="name">
        Name
       </label>
       <input class="form-field__input" id="name" name="name" required="" type="text"/>
      </div>
      <div class="form-field">
       <label class="form-field__label" for="email">
        Email
       </label>
       <input class="form-field__input" id="email" name="email" required="" type="email"/>
      </div>
      <div class="form-field">
       <label class="form-field__label" for="message">
        Message
       </label>
       <textarea class="form-field__input form-field__textarea" id="message" name="message" required=""></textarea>
      </div>
      <button class="button button--primary" type="submit">
       Send Message
      </button>
     </form>
    </div>
   </section>
  </main>
  <div id="site-cta">
  </div>
  <div id="site-footer">
  </div>
  <!-- JS -->
  <script src="js/header.js">
  </script>
  <script src="js/theme-toggle.js">
  </script>
  <script src="js/footer.js">
  </script>
  <script src="js/contact.js">
  </script>
  <script src="js/fullscreen-viewer.js">
  </script>
 </body>
</html>
